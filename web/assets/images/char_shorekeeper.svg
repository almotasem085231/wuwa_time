<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2233"/>
      <stop offset="60%" stop-color="#07131e"/>
      <stop offset="100%" stop-color="#02080e"/>
    </linearGradient>
    <linearGradient id="spectroCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="sBloom">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgShore)"/>
  <rect width="396" height="496" x="2" y="2" rx="14" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Butterfly & Stellar Constellation -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#00f5ff" stroke-width="1" stroke-dasharray="8 12" opacity="0.3"/>
  <circle cx="200" cy="200" r="85" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.4" filter="url(#sBloom)"/>

  <!-- Stellar Butterfly Motif -->
  <g transform="translate(200, 200)" filter="url(#sBloom)">
    <!-- Wings -->
    <path d="M 0,-10 C 60,-90 110,-40 20,20 C 110,60 60,110 0,30 C -60,110 -110,60 -20,20 C -110,-40 -60,-90 0,-10 Z" fill="url(#spectroCyan)" opacity="0.85"/>
    <circle cx="0" cy="10" r="14" fill="#ffffff"/>
  </g>

  <!-- Bottom Gradient Overlay -->
  <rect y="320" width="400" height="180" rx="16" fill="url(#bgShore)" opacity="0.95"/>

  <!-- Resonator Info -->
  <g transform="translate(24, 370)">
    <rect x="0" y="0" width="90" height="26" rx="4" fill="#00f5ff" fill-opacity="0.2" stroke="#00f5ff" stroke-width="1"/>
    <text x="45" y="18" font-family="'Cairo', sans-serif" font-weight="800" font-size="12" fill="#67e8f9" text-anchor="middle">سبيكترو (Spectro)</text>

    <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#fbbf24" text-anchor="end">★★★★★</text>

    <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff">حارسة الشاطئ (Shorekeeper)</text>
    <text x="0" y="88" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#94a3b8">سلاح المكثف | حارسة البحر الأسود</text>
  </g>
</svg>

