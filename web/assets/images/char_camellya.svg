<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d0b2e"/>
      <stop offset="60%" stop-color="#14061a"/>
      <stop offset="100%" stop-color="#07020a"/>
    </linearGradient>
    <linearGradient id="havocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="cBloom">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgCam)"/>
  <rect width="396" height="496" x="2" y="2" rx="14" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Halo & Vine Petals -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="10 15" opacity="0.3"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.4" filter="url(#cBloom)"/>

  <!-- Stylized Camellya Silhouette / Floral Resonator Motif -->
  <g transform="translate(200, 200)" filter="url(#cBloom)">
    <path d="M 0,-80 C 40,-40 60,0 0,60 C -60,0 -40,-40 0,-80 Z" fill="url(#havocGrad)" opacity="0.85"/>
    <path d="M 0,-80 C -40,-40 -60,0 0,60 C 60,0 40,-40 0,-80 Z" fill="#ffffff" opacity="0.3"/>
    <circle cx="0" cy="-20" r="28" fill="#ffd1dc"/>
    <path d="M -40,30 Q 0,80 40,30 Q 0,110 -40,30" fill="url(#havocGrad)"/>
    <!-- Floating Crimson Blossom Petals -->
    <circle cx="-65" cy="-30" r="6" fill="#f43f5e"/>
    <circle cx="75" cy="10" r="5" fill="#ec4899"/>
    <circle cx="50" cy="-60" r="4" fill="#fb7185"/>
  </g>

  <!-- Bottom Gradient Overlay -->
  <rect y="320" width="400" height="180" rx="16" fill="url(#bgCam)" opacity="0.95"/>

  <!-- Resonator Info -->
  <g transform="translate(24, 370)">
    <rect x="0" y="0" width="84" height="26" rx="4" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
    <text x="42" y="18" font-family="'Cairo', sans-serif" font-weight="800" font-size="12" fill="#fb7185" text-anchor="middle">هافوك (Havoc)</text>

    <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#fbbf24" text-anchor="end">★★★★★</text>

    <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff">كامليا (Camellya)</text>
    <text x="0" y="88" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#94a3b8">سلاح السيف | سليل الشجرة السوداء</text>
  </g>
</svg>

