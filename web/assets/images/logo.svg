<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soundwave / Frequency Mark (Wuthering Tacet Mark) -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.8" stroke-dasharray="140 20 60 10" />
    <!-- Inner Resonator Core -->
    <polygon points="50,16 80,68 20,68" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>
    <polygon points="50,84 20,32 80,32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
    <circle cx="50" cy="50" r="6" fill="#00f5ff" filter="url(#glow)"/>
    <!-- Orbiting Accent Ticks -->
    <line x1="50" y1="2" x2="50" y2="98" stroke="#00f5ff" stroke-width="1" opacity="0.2" />
    <line x1="2" y1="50" x2="98" y2="50" stroke="#00f5ff" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Typography: Wuthering Waves Arabic -->
  <g transform="translate(125, 48)">
    <text x="0" y="0" font-family="'Cairo', 'Readex Pro', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#f8fafc" letter-spacing="0.5">
      WUTHERING WAVES
    </text>
    <text x="320" y="-1" font-family="'Cairo', 'Readex Pro', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#00f5ff" filter="url(#glow)">
      ARABIC
    </text>
    <text x="0" y="32" font-family="'Cairo', 'Readex Pro', 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#00e5ff">
      موجات ووزيرينغ بالعربي
    </text>
    <text x="210" y="32" font-family="'Cairo', 'Readex Pro', 'Segoe UI', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
      | المنصة الرسمية للمجتمع العربي
    </text>
  </g>
</svg>

