<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b242b"/>
      <stop offset="60%" stop-color="#08151a"/>
      <stop offset="100%" stop-color="#03080a"/>
    </linearGradient>
    <linearGradient id="spectroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="jBloom">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="500" rx="16" fill="url(#bgJin)"/>
  <rect width="396" height="496" x="2" y="2" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Dragon / Loong Halo -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 15" opacity="0.3"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#fde047" stroke-width="2" opacity="0.4" filter="url(#jBloom)"/>

  <!-- Jue / Dragon Loong Crest & Jinhsi Motif -->
  <g transform="translate(200, 200)" filter="url(#jBloom)">
    <path d="M -70,20 Q -40,-80 0,-90 Q 40,-80 70,20 Q 0,-30 -70,20" fill="url(#spectroGrad)" opacity="0.85"/>
    <circle cx="0" cy="-20" r="28" fill="#e0f2fe"/>
    <!-- Solar Flare / Scales -->
    <polygon points="0,-100 15,-60 -15,-60" fill="#fef08a"/>
    <polygon points="-50,-30 -20,-10 -40,10" fill="#38bdf8" opacity="0.8"/>
    <polygon points="50,-30 20,-10 40,10" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Bottom Gradient Overlay -->
  <rect y="320" width="400" height="180" rx="16" fill="url(#bgJin)" opacity="0.95"/>

  <!-- Resonator Info -->
  <g transform="translate(24, 370)">
    <rect x="0" y="0" width="90" height="26" rx="4" fill="#facc15" fill-opacity="0.2" stroke="#facc15" stroke-width="1"/>
    <text x="45" y="18" font-family="'Cairo', sans-serif" font-weight="800" font-size="12" fill="#fef08a" text-anchor="middle">سبيكترو (Spectro)</text>

    <text x="350" y="20" font-family="'Cairo', sans-serif" font-weight="900" font-size="16" fill="#fbbf24" text-anchor="end">★★★★★</text>

    <text x="0" y="60" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#ffffff">جينسي (Jinhsi)</text>
    <text x="0" y="88" font-family="'Cairo', sans-serif" font-weight="600" font-size="14" fill="#94a3b8">سلاح السيف العريض | قاضية جينغزو</text>
  </g>
</svg>

