<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14" />
      <stop offset="40%" stop-color="#0f1926" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="radialCyan" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radialGold" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#radialCyan)" />
  <rect width="1200" height="600" fill="url(#radialGold)" />

  <!-- Cybernetic Grid & Soundwaves Pattern -->
  <g opacity="0.12" stroke="#00f5ff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
    <line x1="1000" y1="0" x2="1000" y2="600" />
  </g>

  <!-- Angular Tech Frame & Geometry (Wuthering Waves Aesthetic) -->
  <g stroke="url(#cyanNeon)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40,40 L 220,40 L 260,80 L 1140,80 L 1160,100 L 1160,560 L 980,560 L 940,520 L 60,520 L 40,500 Z" />
    <circle cx="260" cy="80" r="4" fill="#00f5ff" />
    <circle cx="940" cy="520" r="4" fill="#00f5ff" />
  </g>

  <!-- Giant Frequency Soundwave / Halo Circle in Background -->
  <circle cx="850" cy="300" r="180" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="18 12" opacity="0.3" filter="url(#glowEffect)" />
  <circle cx="850" cy="300" r="230" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 16" opacity="0.25" />
  <circle cx="850" cy="300" r="110" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.5" />

  <!-- Stylized Resonator Silhouette / Emblem -->
  <g transform="translate(750, 160)" filter="url(#glowEffect)">
    <!-- 5-Star Crest -->
    <path d="M 100,20 L 125,75 L 185,82 L 140,123 L 152,182 L 100,152 L 48,182 L 60,123 L 15,82 L 75,75 Z" fill="url(#goldGlow)" opacity="0.85" />
    <polygon points="100,50 140,130 60,130" fill="#ffffff" opacity="0.6" />
    <circle cx="100" cy="115" r="12" fill="#00f5ff" />
  </g>

  <!-- Overlay Content Texts -->
  <g transform="translate(100, 180)">
    <!-- 5-Star Badges -->
    <rect x="0" y="0" width="160" height="34" rx="4" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Cairo', sans-serif" font-weight="800" font-size="15" fill="#fbbf24" text-anchor="middle">
      ★★★★★ بنر مميز
    </text>

    <!-- Version Title -->
    <text x="0" y="80" font-family="'Cairo', sans-serif" font-weight="900" font-size="44" fill="#f8fafc">
      بنرات الإصدار الحالي
    </text>
    <text x="0" y="130" font-family="'Cairo', sans-serif" font-weight="800" font-size="34" fill="#00f5ff" filter="url(#glowEffect)">
      كامليا (Camellya) &amp; جينسي (Jinhsi)
    </text>

    <!-- Subtitle / Meta -->
    <text x="0" y="175" font-family="'Cairo', sans-serif" font-weight="600" font-size="18" fill="#94a3b8">
      احتمالية مضاعفة للحصول على الشخصيات الحصرية وأسلحتها التوقيعية
    </text>

    <!-- Server Tags -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="120" height="36" rx="6" fill="#1e293b" stroke="#00f5ff" stroke-width="1" />
      <text x="60" y="23" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#00f5ff" text-anchor="middle">سيرفر آسيا</text>

      <rect x="135" y="0" width="120" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="195" y="23" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#38bdf8" text-anchor="middle">سيرفر أوروبا</text>

      <rect x="270" y="0" width="120" height="36" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="330" y="23" font-family="'Cairo', sans-serif" font-weight="700" font-size="14" fill="#818cf8" text-anchor="middle">سيرفر أمريكا</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="580" x2="1160" y2="580" stroke="url(#cyanNeon)" stroke-width="3" filter="url(#glowEffect)" />
</svg>

