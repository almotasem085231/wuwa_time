# Netlify Configuration for Wuthering Waves Arabic
# Single-page app: static frontend on Netlify CDN
# Backend API runs separately on Termux (Termux phone)

[build]
  publish = "web"

# (Optional) If hosting frontend on Netlify and backend API on Termux / Tunnel,
# uncomment and put your public API / Tunnel URL here to avoid CORS:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-tunnel-url.trycloudflare.com/api/:splat"
#   status = 200
#   force = true

# SPA routing — all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Telegram Mini App headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org telegram:;"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JavaScript ES modules — correct MIME type
[[headers]]
  for = "/js/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# CSS files
[[headers]]
  for = "/css/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Static images — longer cache
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Icons — longer cache
[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
